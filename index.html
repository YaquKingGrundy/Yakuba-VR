<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yakuba VR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

<script>
AFRAME.registerComponent('head-track', {
  init: function () {
    this.head = null;
    this.camera = document.querySelector('[camera]');
    this.yaw = 0;

    const findHead = () => {
      let backup = null;

      this.el.object3D.traverse((obj) => {
        if (!obj.isBone) return;

        const name = obj.name.toLowerCase();

        if (
          name === 'head' ||
          name.endsWith('|head') ||
          name.endsWith(':head')
        ) {
          this.head = obj;
        }

        if (!backup && name.includes('head') && !name.includes('end')) {
          backup = obj;
        }
      });

      if (!this.head) this.head = backup;

      console.log('Nyra head bone:', this.head);
    };

    this.el.addEventListener('model-loaded', findHead);
  },

  tick: function () {
    if (!this.head || !this.camera) return;

    const cameraWorld = new THREE.Vector3();
    this.camera.object3D.getWorldPosition(cameraWorld);

    const target = this.el.object3D.worldToLocal(cameraWorld.clone());

    let desiredYaw = Math.atan2(target.x, target.z);

    const maxTurn = THREE.MathUtils.degToRad(40);

    desiredYaw = THREE.MathUtils.clamp(
      desiredYaw,
      -maxTurn,
      maxTurn
    );

    this.yaw += (desiredYaw - this.yaw) * 0.08;

    const offset = new THREE.Quaternion();
    offset.setFromAxisAngle(
      new THREE.Vector3(0, 1, 0),
      this.yaw
    );

    this.head.quaternion.multiply(offset);
  }
});
</script>
</head>

<body>
  <a-scene>
    <a-sky color="#111111"></a-sky>
<a-assets>
  <a-asset-item
    id="nyra"
    src="nyra-animated.glb"
  </a-asset-item>
</a-assets>
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#444444">
    </a-plane>

<a-entity
  gltf-model="#nyra"
  animation-mixer="clip: CharacterArmature|Idle; loop: repeat"
  head-track
  position="0 0 -3"
  rotation="0 0 0"
  scale="1 1 1">
</a-entity>

    <a-text
      value="YAKUBA VR"
      position="-1.2 2.7 -3"
      color="white"
      width="5">
    </a-text>

    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
</body>
</html>
