<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yakuba VR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

<script>
AFRAME.registerComponent('head-track', {
  init: function () {
    this.head = null;
    this.camera = document.querySelector('[camera]');
    this.yaw = 0;

    const findHead = () => {
      let backup = null;
      let eyeBones = [];
      let morphs = [];
      let torsoBones = [];

      this.el.object3D.traverse((obj) => {
        if (!obj.isBone) return;

        const name = obj.name.toLowerCase();
        
        console.log('BONE:', obj.name);
        if (
  name.includes('spine') ||
  name.includes('chest') ||
  name.includes('upper')
) {
  torsoBones.push(obj.name);
        }
        if (name.includes('eye')) {
    eyeBones.push(obj.name);
        }

        if (
          name === 'head' ||
          name.endsWith('|head') ||
          name.endsWith(':head')
        ) {
          this.head = obj;
        }

        if (!backup && name.includes('head') && !name.includes('end')) {
          backup = obj;
        }
      });

      if (!this.head) this.head = backup;
      const debug = document.querySelector('#debug');

if (debug) {
  debug.setAttribute(
    'value',
    this.head
  ? 'HEAD: ' + this.head.name +
    ' | EYES: ' +
    (eyeBones.length ? eyeBones.join(', ') : 'NONE') +
    ' | MORPHS: ' +
(morphs.length ? morphs.flat().join(', ') : 'NONE') +
' | TORSO: ' +
(torsoBones.length ? torsoBones.join(', ') : 'NONE')
  );
}

      console.log('Nyra head bone:', this.head);
    };

    this.el.addEventListener('model-loaded', findHead);
  },

  tick: function () {
    if (!this.head) return;

    if (!this.camera) {
        this.camera = document.querySelector('[camera]');
    }

    if (!this.camera) return;

    const cameraPosition = new THREE.Vector3();
    this.camera.object3D.getWorldPosition(cameraPosition);

    const headPosition = new THREE.Vector3();
    this.head.getWorldPosition(headPosition);

    const dx = cameraPosition.x - headPosition.x;
    const dz = cameraPosition.z - headPosition.z;

    let targetAngle = Math.atan2(dx, dz);

const maxTurn = THREE.MathUtils.degToRad(45);

targetAngle = THREE.MathUtils.clamp(
    targetAngle,
    -maxTurn,
    maxTurn
);

this.yaw += (targetAngle - this.yaw) * 0.08;

this.head.rotation.y = this.yaw;
  }
});
</script>
</head>

<body>
  <a-scene>
    <a-sky color="#111111"></a-sky>
<a-assets>
  <a-asset-item
    id="nyra"
    src="nyra-animated.glb"
  </a-asset-item>
</a-assets>
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#444444">
    </a-plane>

<a-entity
  gltf-model="#nyra"
  animation-mixer="clip: CharacterArmature|Idle; loop: repeat"
  head-track
  position="0 0 -3"
  rotation="0 0 0"
  scale="1 1 1">
</a-entity>

    <a-text
      value="YAKUBA VR"
      position="-1.2 2.7 -3"
      color="white"
      width="5">
    </a-text>
    <a-text
  id="debug"
  value="HEAD DEBUG: waiting..."
  position="-1.5 2.2 -2"
  color="yellow"
  width="4">
</a-text>

    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
</body>
</html>
