<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yakuba VR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script>
AFRAME.registerComponent('model-debug', {
  init: function () {
    const status = document.querySelector('#status');

    this.el.addEventListener('model-loaded', () => {
      status.setAttribute('value', 'MODEL LOADED');
    });

    this.el.addEventListener('model-error', (event) => {
      let details = '';

      try {
        details = JSON.stringify(event.detail);
      } catch (e) {
        details = String(event.detail);
      }

      status.setAttribute(
        'value',
        'MODEL ERROR: ' + details
      );
    });
  }
});
</script>
</head>

<body>
  <a-scene>
    <a-sky color="#111111"></a-sky>
<a-assets>
  <a-asset-item
    id="nyra"
    src="Punk%20by%20Quaternius%20-%20djXoqejw6w.glb">
  </a-asset-item>
</a-assets>
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#444444">
    </a-plane>

<a-entity
  gltf-model="#nyra"
  model-debug 
  position="0 0 -3"
  rotation="0 0 0"
  scale="1 1 1">
</a-entity>
<a-text
  id="status"
  value="LOADING MODEL..."
  position="-1.2 1.5 -2"
  color="red"
  width="4">
</a-text>
    <a-text
      value="YAKUBA VR"
      position="-1.2 2.7 -3"
      color="white"
      width="5">
    </a-text>

    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
</body>
</html>
