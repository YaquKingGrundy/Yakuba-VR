<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yakuba VR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

</head>

<body>
  <a-scene>
    <a-sky color="#111111"></a-sky>
<a-assets>
  <a-asset-item
    id="nyra"
    src="nyra-animated.glb"
  </a-asset-item>
</a-assets>
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#444444">
    </a-plane>

<a-entity
  gltf-model="#nyra"
  animation-mixer="clip: CharacterArmature|Idle; loop: repeat"
  position="0 0 -3"
  rotation="0 0 0"
  scale="1 1 1">
</a-entity>

    <a-text
      value="YAKUBA VR"
      position="-1.2 2.7 -3"
      color="white"
      width="5">
    </a-text>

    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
</body>
</html>
